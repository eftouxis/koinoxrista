function allocate(c,w){const W=w.reduce((a,b)=>a+b,0);if(!W||!c)return w.map(()=>0);const raw=w.map(x=>c*x/W),fl=raw.map(Math.floor);let r=c-fl.reduce((a,b)=>a+b,0);
 raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(r>0){fl[i]++;r--}});return fl}
function weight(u,key,p){if(key==='koina')return u.xe;if(key==='asanser')return u.xa;if(key==='isa')return 1;
 if(key==='therm')return u.meters.reduce((a,m)=>a+m.xt,0);if(key==='pagio')return u.meters.reduce((a,m)=>a+(S.settings.pagioKey==='xp'?m.xp:m.xt),0);
 if(key==='cons')return u.meters.reduce((a,m)=>{const r=p.readings?.[m.id];return a+(r?Math.max(0,num(r.e)-num(r.s)):0)*m.xt},0);return 0}
function calc(p){const res={};S.units.forEach(u=>res[u.id]={lines:[],ten:0,own:0,tot:0});const byExp=[];
 const add=(desc,key,payer,c,ref)=>{const w=S.units.map(u=>weight(u,key,p)),a=allocate(c,w),W=w.reduce((x,y)=>x+y,0);byExp.push({desc,key,payer,amount:c,ref});
  S.units.forEach((u,i)=>{if(w[i])res[u.id].lines.push({desc,key,payer,amount:a[i],w:w[i],W,total:c})})};
 let exp=0;for(const e of p.expenses){exp+=e.amount;add(e.desc,e.key,e.payer,e.amount,e.id)}
 const g=p.gas?.amount||0;if(g){exp+=g;const cw=S.units.reduce((a,u)=>a+weight(u,'cons',p),0);
  if(!cw)add('Φυσικό αέριο – πάγια τέλη (χωρίς κατανάλωση)','therm','enoikos',g,'gas');else{const pct=S.settings.pagioPct,pag=Math.round(g*pct/100);add('Θέρμανση – πάγιο '+String(pct).replace('.',',')+'%','pagio','enoikos',pag,'gas');add('Θέρμανση – κατανάλωση','cons','enoikos',g-pag,'gas')}}
 let all=0;for(const k in res){const r=res[k];r.lines.forEach(l=>{if(l.payer==='idioktitis')r.own+=l.amount;else r.ten+=l.amount});r.tot=r.ten+r.own;all+=r.tot}return{res,exp,all,byExp}}
function ledger(unitId){ // FIFO: οι πληρωμές εξοφλούν πρώτα τα παλαιότερα· οι μήνες ιστορικού (Polygon) δεν επηρεάζουν το υπόλοιπο
 const op=unitOf(unitId)?.opening||0,pays=S.payments.filter(x=>x.unit===unitId);let pool=pays.reduce((a,x)=>a+x.amount,0)+(op<0?-op:0);const paid=pool;
 const ch=(op>0?[{pid:'open',amt:op}]:[]).concat(issued().filter(p=>!p.hist).map(p=>({pid:p.id,amt:p.result.res[unitId].tot})));
 const rows=ch.map(({pid,amt})=>{const ap=Math.min(amt,Math.max(0,pool));pool-=ap;return{pid,amt,paid:ap,rest:amt-ap,status:amt===0||ap>=amt?'paid':ap>0?'part':'unpaid'}});
 const charged=rows.reduce((a,r)=>a+r.amt,0);return{rows,charged,paid,balance:charged-paid}}
function cash(){let bank=S.settings.openingCash||0,cashm=0;
 for(const x of S.payments){if(x.method==='Συμψηφισμός')continue;x.method==='Μετρητά'?(cashm+=x.amount):(bank+=x.amount)}for(const x of S.bpay){if(x.method==='Συμψηφισμός')continue;x.method==='Μετρητά'?(cashm-=x.amount):(bank-=x.amount)}return{bank,cashm}}
function finance(){const c=cash(),L=S.units.map(u=>ledger(u.id).balance);
 const resIn=(S.settings.openingReserve||0)+issued().filter(p=>!p.hist).reduce((a,p)=>a+p.expenses.filter(e=>e.cat==='apothem').reduce((b,e)=>b+e.amount,0),0),resOut=S.bpay.filter(b=>b.fromRes).reduce((a,b)=>a+b.amount,0);
 return{avail:c.bank+c.cashm,bank:c.bank,cashm:c.cashm,reserve:resIn-resOut,unpaid:expList().reduce((a,e)=>a+Math.max(0,e.rest),0),owed:L.reduce((a,b)=>a+Math.max(0,b),0)}}
function expList(){const L=[];for(const p of issued().filter(p=>!p.hist)){for(const e of p.expenses)L.push({ref:e.id,pid:p.id,desc:e.desc,amount:e.amount,vendor:e.vendor});

const APPS_SCRIPT=`// script.google.com → Νέο έργο → επικόλληση → Ανάπτυξη → Νέα ανάπτυξη → Εφαρμογή ιστού
// Εκτέλεση ως: Εγώ · Πρόσβαση: Οποιοσδήποτε
const KEY = 'ΒΑΛΕ-ΕΝΑ-ΜΥΣΤΙΚΟ';
function doPost(e) {
  const d = JSON.parse(e.postData.contents);
  if (d.key !== KEY) return ContentService.createTextOutput('no');
  const opt = { to: d.to, subject: d.subject, htmlBody: d.html, name: d.from };
  if (d.attachment) {
    const blob = Utilities.newBlob(Utilities.base64Decode(d.attachment.b64), d.attachment.mime, d.attachment.name);
    opt.attachments = [blob];
    if (d.saveToDrive) {
      const it = DriveApp.getFoldersByName('Κοινόχρηστα – αντίγραφα');
      const folder = it.hasNext() ? it.next() : DriveApp.createFolder('Κοινόχρηστα – αντίγραφα');
      folder.createFile(blob);
    }
  }
  MailApp.sendEmail(opt);
  return ContentService.createTextOutput('ok');
}

async function unzipEntries(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);let e=buf.byteLength-22;while(e>0&&dv.getUint32(e,true)!==0x06054b50)e--;

  if(!/^xl\/(sharedStrings|worksheets\/sheet1)\.xml$/.test(name))continue;const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true),data=u8.slice(lo+30+lnl+lxl,lo+30+lnl+lxl+cs);
  out[name]=m===0?dec.decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}return out}

 d.querySelectorAll('row').forEach(r=>{const a=[];r.querySelectorAll('c').forEach(c=>{const ref=c.getAttribute('r')||'',col=ref.replace(/\d+/g,'').split('').reduce((x,ch)=>x*26+ch.charCodeAt(0)-64,0)-1,t=c.getAttribute('t'),v=c.querySelector('v')?.textContent??c.querySelector('t')?.textContent??'';a[col]=t==='s'?ss[+v]:v});rows.push([...a].map(x=>x??''))});return rows}
function parseCSV(txt){const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':(txt.includes('\t')?'\t':',');const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='"'&&txt[i+1]==='"'){cur+='"';i++}else if(ch==='"')q=false;else cur+=ch}else if(ch==='"')q=true;else if(ch===sep){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur=''}else cur+=ch}
 if(cur||row.length){row.push(cur);rows.push(row)}return rows}
const toISO=v=>{if(/^\d{5}(\.\d+)?$/.test(String(v))){const d=new Date(Math.round((+v-25569)*864e5));return d.toISOString().slice(0,10)}const m=String(v).match(/(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return`${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}const m2=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:''};
const toAmt=v=>{let s=String(v).trim().replace(/[€\s]/g,'');if(!s||!/\d/.test(s))return null;if(/^-?\d+(\.\d+)?$/.test(s))return Math.round(parseFloat(s)*100);if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const n=parseFloat(s);return isNaN(n)?null:Math.round(n*100)};

/* ---------------- πρόβλεψη / μέσοι όροι ---------------- */
const catOf=e=>(['mikro','allo','ergo'].includes(e.cat)&&guessCat(e.desc))||e.cat;
function catHist(beforePid){const P=issued().filter(p=>p.id<beforePid).slice(-12),o={};
 for(const p of P){for(const e of p.expenses||[]){const c=catOf(e);(o[c]=o[c]||[]).push({pid:p.id,a:e.amount})}if(p.gas?.amount)(o.gas=o.gas||[]).push({pid:p.id,a:p.gas.amount})}return o}
function anomaly(p,e){const H=catHist(p.id)[e.id==='gas'?'gas':catOf(e)];if(!H||H.length<2||['ergo','asanser_ergo','garaz_ergo','therm_ergo','allo','isa','apothem'].includes(e.cat))return'';const avg=H.reduce((a,x)=>a+x.a,0)/H.length;
 return e.amount>avg*1.4&&e.amount-avg>1000?`<span class="tag w" title="Μέσος όρος ${eur(Math.round(avg))} σε ${H.length} μήνες">↑ ${Math.round((e.amount/avg-1)*100)}% από τον μ.ό.</span>`:''}
function forecastCard(){const L=issued(),last=L.at(-1);if(!last)return'';const nx=(()=>{const[y,m]=(draft()?.id||last.id).split('-').map(Number);return draft()?draft().id:`${m===12?y+1:y}-${String(m===12?1:m+1).padStart(2,'0')}`})();
 const ly=String(+nx.slice(0,4)-1)+nx.slice(4),pl=L.find(p=>p.id===ly),H=catHist('9999'),rows=[];
 for(const c of Object.keys(H)){const a=H[c],avg=a.reduce((s,x)=>s+x.a,0)/a.length,lyv=pl?(c==='gas'?(pl.gas?.amount||0):(pl.expenses||[]).filter(e=>catOf(e)===c).reduce((s,e)=>s+e.amount,0)):null;rows.push({c,n:a.length,avg,lyv})}
 rows.sort((a,b)=>b.avg*b.n-a.avg*a.n);const est=rows.reduce((s,r)=>s+(r.lyv!=null&&pl?r.lyv:(r.n>=9?r.avg:0)),0);
 return`<div class="card"><h2>Πρόβλεψη ${esc(plabel(nx))}</h2><p>Εκτίμηση συνόλου: <b style="font-size:18px">${eur(Math.round(est))}</b> <span class="mut">${pl?`(με βάση: ${esc(plabel(ly))} και τα σταθερά έξοδα)`:'(με βάση τα σταθερά έξοδα των τελευταίων 12 μηνών)'}</span></p>
 <div class="scroll"><table><tr><th>Κατηγορία</th><th class="n">Μήνες με δαπάνη (12μ.)</th><th class="n">Μέσος όρος όταν υπάρχει</th><th class="n">${pl?esc(plabel(ly)):'Πέρσι'}</th></tr>${rows.map(r=>`<tr><td>${esc(r.c==='gas'?'Θέρμανση (φυσικό αέριο)':(CATS[r.c]||[r.c])[0])}</td><td class="n">${r.n}</td><td class="n">${eur(Math.round(r.avg))}</td><td class="n">${r.lyv!=null?eur(r.lyv):'—'}</td></tr>`).join('')}</table></div><p class="mut">Δαπάνη που ξεπερνά πολύ τον μέσο όρο σημειώνεται με «↑» στις δαπάνες του μήνα.</p></div>`}

 for(const m of allMeters()){const pts=acc.filter(a=>a.v[m.id]!=null);if(!pts.length)continue;const b=[...pts].reverse().find(a=>a.date<=date),f=pts.find(a=>a.date>=date);
