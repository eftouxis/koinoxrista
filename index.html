/* ---------------- υπολογισμοί ---------------- */
function allocate(c,w){const W=w.reduce((a,b)=>a+b,0);if(!W||!c)return w.map(()=>0);const raw=w.map(x=>c*x/W),fl=raw.map(Math.floor);let r=c-fl.reduce((a,b)=>a+b,0);
 raw.map((x,i)=>[x-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(r>0){fl[i]++;r--}});return fl}
function weight(u,key,p){if(key==='koina')return u.xe;if(key==='asanser')return u.xa;if(key==='isa')return 1;
 if(key==='therm')return u.meters.reduce((a,m)=>a+m.xt,0);if(key==='pagio')return u.meters.reduce((a,m)=>a+(S.settings.pagioKey==='xp'?m.xp:m.xt),0);
 if(key==='cons')return u.meters.reduce((a,m)=>{const r=p.readings?.[m.id];return a+(r?Math.max(0,num(r.e)-num(r.s)):0)*m.xt},0);return 0}
function calc(p){const res={};S.units.forEach(u=>res[u.id]={lines:[],ten:0,own:0,tot:0});const byExp=[];
 const add=(desc,key,payer,c,ref)=>{const w=S.units.map(u=>weight(u,key,p)),a=allocate(c,w),W=w.reduce((x,y)=>x+y,0);byExp.push({desc,key,payer,amount:c,ref});
  S.units.forEach((u,i)=>{if(w[i])res[u.id].lines.push({desc,key,payer,amount:a[i],w:w[i],W,total:c})})};
 let exp=0;for(const e of p.expenses){exp+=e.amount;add(e.desc,e.key,e.payer,e.amount,e.id)}
 const g=p.gas?.amount||0;if(g){exp+=g;const pct=S.settings.pagioPct,pag=Math.round(g*pct/100);add('Θέρμανση – πάγιο '+String(pct).replace('.',',')+'%','pagio','enoikos',pag,'gas');
  const cw=S.units.reduce((a,u)=>a+weight(u,'cons',p),0);add('Θέρμανση – κατανάλωση'+(cw?'':' (χωρίς μετρήσεις)'),cw?'cons':'therm','enoikos',g-pag,'gas')}
 let all=0;for(const k in res){const r=res[k];r.lines.forEach(l=>{if(l.payer==='idioktitis')r.own+=l.amount;else r.ten+=l.amount});r.tot=r.ten+r.own;all+=r.tot}return{res,exp,all,byExp}}
function ledger(unitId){ // FIFO: οι πληρωμές εξοφλούν πρώτα τα παλαιότερα· οι μήνες ιστορικού (Polygon) δεν επηρεάζουν το υπόλοιπο
 const op=unitOf(unitId)?.opening||0,pays=S.payments.filter(x=>x.unit===unitId);let pool=pays.reduce((a,x)=>a+x.amount,0)+(op<0?-op:0);const paid=pool;
 const ch=(op>0?[{pid:'open',amt:op}]:[]).concat(issued().filter(p=>!p.hist).map(p=>({pid:p.id,amt:p.result.res[unitId].tot})));
 const rows=ch.map(({pid,amt})=>{const ap=Math.min(amt,Math.max(0,pool));pool-=ap;return{pid,amt,paid:ap,rest:amt-ap,status:amt===0||ap>=amt?'paid':ap>0?'part':'unpaid'}});
 const charged=rows.reduce((a,r)=>a+r.amt,0);return{rows,charged,paid,balance:charged-paid}}
function cash(){let bank=S.settings.openingCash||0,cashm=0;
 for(const x of S.payments){if(x.method==='Συμψηφισμός')continue;x.method==='Μετρητά'?(cashm+=x.amount):(bank+=x.amount)}for(const x of S.bpay){if(x.method==='Συμψηφισμός')continue;x.method==='Μετρητά'?(cashm-=x.amount):(bank-=x.amount)}return{bank,cashm}}
function finance(){const c=cash(),L=S.units.map(u=>ledger(u.id).balance);
 const resIn=(S.settings.openingReserve||0)+issued().filter(p=>!p.hist).reduce((a,p)=>a+p.expenses.filter(e=>e.cat==='apothem').reduce((b,e)=>b+e.amount,0),0),resOut=S.bpay.filter(b=>b.fromRes).reduce((a,b)=>a+b.amount,0);
 return{avail:c.bank+c.cashm,bank:c.bank,cashm:c.cashm,reserve:resIn-resOut,unpaid:expList().reduce((a,e)=>a+Math.max(0,e.rest),0),owed:L.reduce((a,b)=>a+Math.max(0,b),0)}}
function expList(){const L=[];for(const p of issued().filter(p=>!p.hist)){for(const e of p.expenses)L.push({ref:e.id,pid:p.id,desc:e.desc,amount:e.amount,vendor:e.vendor});
 if(p.gas?.amount)L.push({ref:p.id+':gas',pid:p.id,desc:p.gas.desc||'Θέρμανση',amount:p.gas.amount,vendor:p.gas.vendor})}
 return L.map(e=>{const pd=S.bpay.filter(b=>b.exp===e.ref).reduce((a,b)=>a+b.amount,0);return{...e,paid:pd,rest:e.amount-pd}})}
const ref=(u,pid)=>u.label+'-'+pid.replace('-','');
const recips=u=>[u.ownerEmail,u.tenantEmail].map(x=>(x||'').trim()).filter(Boolean);

 ${[...S.ann].sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="card"><div class="row"><div><b>${esc(a.title)}</b><div class="mut">${fdate(a.date)}${a.emailed?' · email σε '+a.emailed:''}</div></div><button class="sm d fx" data-dela="${a.id}">Διαγραφή</button></div><p style="white-space:pre-wrap;margin:8px 0 0">${esc(a.text)}</p></div>`).join('')}`}
function pollResults(pl,V,showWho){const n=V.length||1;return`<p class="mut" style="white-space:pre-wrap">${esc(pl.desc||'')}</p>${pl.options.map(o=>{const c=V.filter(v=>v.choice===o).length;return`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${esc(o)}</span><b>${c}</b></div><div style="height:8px;background:#eef2f6;border-radius:4px"><div style="height:8px;width:${Math.round(c/n*100)}%;background:var(--pri);border-radius:4px"></div></div>${showWho&&c?`<div class="mut">${V.filter(v=>v.choice===o).map(v=>esc(unitOf?.(v.unit_id)?.label||v.unit_id)).join(', ')}</div>`:''}</div>`}).join('')}`}

function vReports(){const years=[...new Set(issued().map(p=>p.id.slice(0,4)))].sort().reverse();const y=sel&&years.includes(sel)?sel:years[0];
 if(!y)return'<div class="card mut">Δεν υπάρχουν εκδοθέντα κοινόχρηστα.</div>';const ps=issued().filter(p=>p.id.startsWith(y));
 const byCat={};ps.forEach(p=>{p.expenses.forEach(e=>{const k=CATS[e.cat]?.[0]||'Άλλο';byCat[k]=(byCat[k]||0)+e.amount});if(p.gas?.amount)byCat['Θέρμανση (αέριο)']=(byCat['Θέρμανση (αέριο)']||0)+p.gas.amount});
 const tot=Object.values(byCat).reduce((a,b)=>a+b,0);
 return`<div class="card"><div class="row"><label style="flex:0 1 160px">Έτος<select id="ry">${years.map(x=>`<option ${x===y?'selected':''}>${x}</option>`).join('')}</select></label><button class="fx" id="rprint">Εκτύπωση αναφοράς</button></div></div><div id="rep"><div class="card"><h2>Δαπάνες ${y} ανά κατηγορία</h2><div class="scroll"><table><tr><th>Κατηγορία</th><th class="n">Ποσό</th><th class="n">%</th></tr>
 ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${eur(v)}</td><td class="n">${tot?Math.round(v/tot*1000)/10:0}%</td></tr>`).join('')}<tr><td><b>Σύνολο</b></td><td class="n"><b>${eur(tot)}</b></td><td></td></tr></table></div></div>
 <div class="card"><h2>Διαμερίσματα ${y}</h2><div class="scroll"><table><tr><th>Διαμ.</th><th>Όνομα</th><th class="n">Χρεώσεις έτους</th><th class="n">Τρέχον υπόλοιπο</th></tr>
 ${S.units.map(u=>`<tr><td>${esc(u.label)}</td><td>${esc(u.owner)}</td><td class="n">${eur(ps.reduce((a,p)=>a+p.result.res[u.id].tot,0))}</td><td class="n">${eur(ledger(u.id).balance)}</td></tr>`).join('')}</table></div></div></div>`}

${(pub.ann||[]).slice(0,3).map(a=>`<div class="card"><b>${esc(a.title)}</b><div class="mut">${fdate(a.date)}</div><p style="white-space:pre-wrap;margin:8px 0 0">${esc(a.text)}</p></div>`).join('')}<div id="nprev"></div>`}

function uMeters(){const M=unitData.card?.meters||[];if(!M.length)return'<div class="card mut">Δεν υπάρχουν ακόμα ενδείξεις ωρομετρητών.</div>';

    for(const u of S.units){const to=recips(u);if(!to.length)continue;try{await fetch(st.mailUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:st.mailKey,to:to.join(','),subject:'Ανακοίνωση: '+an.title,from:'Κοινόχρηστα '+st.name,
     html:`<div style="font-family:Arial,sans-serif;max-width:600px"><h2 style="margin:0 0 8px">${esc(an.title)}</h2><p style="white-space:pre-wrap">${esc(an.text)}</p><p style="color:#666;font-size:12px">${esc(st.address||st.name)} · Ο διαχειριστής: ${esc(st.manager)}</p></div>`})});n++}catch(err){}}
    an.emailed=n;save();toast(`Δημοσιεύτηκε και στάλθηκε σε ${n} διαμερίσματα`)}else{save();toast('Δημοσιεύτηκε')}};
  $$('[data-dela]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή ανακοίνωσης;')){S.ann=S.ann.filter(x=>x.id!==b.dataset.dela);save()}})}
 $$('[data-csub]').forEach(b=>b.onclick=async()=>{csub=b.dataset.csub;if(csub==='req'||csub==='polls')await loadLive();render()});
 $$('[data-rsave]').forEach(b=>b.onclick=async()=>{const id=b.dataset.rsave;try{await B.updateRequest(id,{reply:$(`[data-rr="${id}"]`).value.trim(),status:$(`[data-rs="${id}"]`).value});await loadLive();render();toast('Αποθηκεύτηκε')}catch(e){toast(e.message)}});
 if($('#pof'))$('#pof').onsubmit=e=>{e.preventDefault();const o=$('#poo').value.split('\n').map(x=>x.trim()).filter(Boolean);if(o.length<2){toast('Βάλε τουλάχιστον 2 επιλογές');return}S.polls.push({id:uid(),title:$('#pot').value.trim(),desc:$('#pod').value.trim(),options:o,open:true,created:today()});save();toast('Δημοσιεύτηκε')};
 $$('[data-ptog]').forEach(b=>b.onclick=()=>{const pl=S.polls.find(x=>x.id===b.dataset.ptog);pl.open=!pl.open;save()});
 $$('[data-pdel]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή ψηφοφορίας;')){S.polls=S.polls.filter(x=>x.id!==b.dataset.pdel);save()}});
 if($('#dof'))$('#dof').onsubmit=e=>{e.preventDefault();const u=$('#dou').value.trim();if(!/^https:\/\//.test(u)){toast('Ο σύνδεσμος πρέπει να ξεκινά με https://');return}S.docs.push({id:uid(),title:$('#dot').value.trim(),url:u,date:today()});save()};
 $$('[data-ddel]').forEach(b=>b.onclick=()=>{S.docs=S.docs.filter(x=>x.id!==b.dataset.ddel);save()});
 /* αναφορές */
 if($('#ry')){$('#ry').onchange=e=>{sel=e.target.value;render()};$('#rprint').onclick=()=>doPrint('<div class="notice">'+$('#rep').innerHTML+'</div>')}
}
(async()=>{try{me=await B.init();if(me)await afterLogin();else render()}catch(e){$('#app').innerHTML=`<div class="login"><div class="card"><h1>Σφάλμα</h1><p>${esc(e.message)}</p><button class="p" id="retry">Δοκίμασε ξανά</button> <button id="relog">Αποσύνδεση</button></div></div>`;$('#retry').onclick=()=>location.reload();$('#relog').onclick=async()=>{try{await B.logout()}catch(x){}location.reload()}}})();
}
</script>
</body>
</html>
