function allocate(c,w){const W=w.reduce((a,b)=>a+b,0);if(!W||!c)return w.map(()=>0);const raw=w.map(x=>c*x/W),fl=raw.map(Math.floor);let r=c-fl.reduce((a,b)=>a+b,0);

  S.units.forEach((u,i)=>{if(w[i])res[u.id].lines.push({desc,key,payer,amount:a[i],w:w[i],W,total:c})})};

 const g=p.gas?.amount||0;if(g){exp+=g;const pct=S.settings.pagioPct,pag=Math.round(g*pct/100);add('Θέρμανση – πάγιο '+String(pct).replace('.',',')+'%','pagio','enoikos',pag,'gas');
  const cw=S.units.reduce((a,u)=>a+weight(u,'cons',p),0);add('Θέρμανση – κατανάλωση'+(cw?'':' (χωρίς μετρήσεις)'),cw?'cons':'therm','enoikos',g-pag,'gas')}
 let all=0;for(const k in res){const r=res[k];r.lines.forEach(l=>{if(l.payer==='idioktitis')r.own+=l.amount;else r.ten+=l.amount});r.tot=r.ten+r.own;all+=r.tot}return{res,exp,all,byExp}}
function ledger(unitId){ // FIFO: οι πληρωμές εξοφλούν πρώτα τα παλαιότερα
 const pays=S.payments.filter(x=>x.unit===unitId);let pool=pays.reduce((a,x)=>a+x.amount,0);const paid=pool;
 const rows=issued().map(p=>{const amt=p.result.res[unitId].tot,ap=Math.min(amt,Math.max(0,pool));pool-=ap;return{pid:p.id,amt,paid:ap,rest:amt-ap,status:amt===0||ap>=amt?'paid':ap>0?'part':'unpaid'}});
 const charged=rows.reduce((a,r)=>a+r.amt,0);return{rows,charged,paid,balance:charged-paid}}
function cash(){let bank=S.settings.openingCash||0,cashm=0;
 for(const x of S.payments)(x.method==='Μετρητά'?(cashm+=x.amount):(bank+=x.amount));for(const x of S.bpay)(x.method==='Μετρητά'?(cashm-=x.amount):(bank-=x.amount));return{bank,cashm}}
function expList(){const L=[];for(const p of issued()){for(const e of p.expenses)L.push({ref:e.id,pid:p.id,desc:e.desc,amount:e.amount,vendor:e.vendor});
 if(p.gas?.amount)L.push({ref:p.id+':gas',pid:p.id,desc:p.gas.desc||'Θέρμανση',amount:p.gas.amount,vendor:p.gas.vendor})}
 return L.map(e=>{const pd=S.bpay.filter(b=>b.exp===e.ref).reduce((a,b)=>a+b.amount,0);return{...e,paid:pd,rest:e.amount-pd}})}

 ${(pub.ann||[]).slice(0,3).map(a=>`<div class="card"><b>${esc(a.title)}</b><div class="mut">${fdate(a.date)}</div><p style="white-space:pre-wrap;margin:8px 0 0">${esc(a.text)}</p></div>`).join('')}<div id="nprev"></div>`}
function uBills(){const c=unitData.card;if(!c||!c.notices.length)return'<div class="card mut">Δεν έχουν εκδοθεί κοινόχρηστα.</div>';
 return c.notices.map((n,i)=>`<details class="card"><summary>${esc(plabel(n.pid))} · ${eur(n.tot)} <span class="st ${STATUS[n.status][0]}" style="float:right">${STATUS[n.status][1]}</span></summary><br><div class="scroll"><table>${n.lines.map(l=>`<tr><td>${esc(l.desc)}</td><td class="n">${eur(l.amount)}</td></tr>`).join('')}<tr><td><b>Σύνολο</b></td><td class="n"><b>${eur(n.tot)}</b></td></tr></table></div><br><button class="sm" data-upn="${i}">Εκτύπωση ειδοποιητηρίου</button> <button class="sm" data-ushow="${i}">Προβολή</button></details>`).join('')+'<div id="nprev"></div>'}
function uTx(){const c=unitData.card;return`<div class="card"><h2>Οι πληρωμές μου</h2><div class="scroll"><table><tr><th>Ημερομηνία</th><th>Τρόπος</th><th class="n">Ποσό</th></tr>${(c?.payments||[]).map(x=>`<tr><td>${fdate(x.date)}</td><td>${esc(x.method)}</td><td class="n">${eur(x.amount)}</td></tr>`).join('')||'<tr><td colspan=3 class="mut">Καμία πληρωμή</td></tr>'}</table></div></div>`}
function uReports(){const m=unitData.pub.months||[];return m.map(x=>`<details class="card"><summary>${esc(plabel(x.pid))} · σύνολο κτιρίου ${eur(x.total)}</summary><br><div class="scroll"><table>${x.items.map(i=>`<tr><td>${esc(i.desc)}</td><td class="n">${eur(i.amount)}</td></tr>`).join('')}</table></div></details>`).join('')||'<div class="card mut">Καμία δαπάνη ακόμα.</div>'}
function uComm(){const a=unitData.pub.ann||[];return a.map(x=>`<div class="card"><b>${esc(x.title)}</b><div class="mut">${fdate(x.date)}</div><p style="white-space:pre-wrap;margin:8px 0 0">${esc(x.text)}</p></div>`).join('')||'<div class="card mut">Καμία ανακοίνωση.</div>'}
function uKey(){return`<div class="card" style="max-width:420px"><h2>Αλλαγή κωδικού</h2><form id="kf"><label>Νέος κωδικός<input type="password" id="k1" minlength="6" required autocomplete="new-password"></label><br><label>Επανάληψη<input type="password" id="k2" required autocomplete="new-password"></label><br><button class="p">Αλλαγή</button></form></div>`}

/* ---------------- render ---------------- */
function render(){const app=$('#app');
 if(!me){app.innerHTML=`<div class="login"><div class="card"><h1>Κοινόχρηστα</h1><p class="mut">Σύνδεση στην πολυκατοικία</p><form id="lf"><label>Όνομα χρήστη<input id="lu" autocomplete="username" autocapitalize="none" required></label><br><label>Κωδικός<input id="lp" type="password" autocomplete="current-password" required></label><br><button class="p" style="width:100%">Σύνδεση</button><p id="lerr" class="bad"></p></form>
  ${B.demo?'<p class="mut">Δοκιμαστική λειτουργία: διαχειριστής <b>admin / admin</b>, διαμερίσματα <b>a1, a2, a3, b1 … e1 / 1234</b>.</p>':''}</div></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault();try{me=await B.login($('#lu').value.trim(),$('#lp').value);await afterLogin()}catch(err){$('#lerr').textContent=err.message}};return}
 const M=me.role==='admin'?ADMIN:UNIT;if(!M.some(([k])=>k===page))page='home';
 const V=me.role==='admin'?{home:vHome,building:vBuilding,vendors:vVendors,units:vUnits,bills:vBills,tx:vTx,bpay:vBpay,comm:vComm,reports:vReports}:{home:uHome,bills:uBills,tx:uTx,reports:uReports,comm:uComm,key:uKey};
 const title=M.find(([k])=>k===page)[1];const nm=me.role==='admin'?S.settings.name:(unitData.pub.name||'');
 app.innerHTML=`<div class="layout"><aside><div class="brand">Κοινόχρηστα<small>${esc(nm)}</small></div><nav>${M.map(([k,t])=>`<button data-page="${k}" class="${page===k?'on':''}">${IC[k]||''}<span>${t}</span></button>`).join('')}</nav>
 <div class="foot">${esc(me.role==='admin'?'Διαχειριστής':'Διαμέρισμα '+(unitData.card?.unit.label||me.unit))}<button id="logout">Αποσύνδεση</button></div></aside>
 <div class="content">${B.demo?'<div class="demo">Δοκιμαστική λειτουργία: τα δεδομένα μένουν σε αυτή τη συσκευή μέχρι να συνδεθεί το Supabase.</div>':''}
 <div class="top"><h1>${esc(title)}</h1>${me.role==='admin'?`<span class="mut" id="saving">${esc(saving)}</span>`:''}<button class="sm" id="logout2">Αποσύνδεση</button></div><main>${V[page]()}</main></div></div>`;
 bind()}
async function afterLogin(){if(me.role==='admin'){S=await B.loadAdmin();if(!S){S=seedState();const{cards,pub}=derive();await B.saveAdmin(S,cards,pub)}unitData={users:await B.listUsers()}}
 else unitData=await B.loadUnit(me.unit);page='home';render()}
function showPrev(html){const d=$('#nprev');if(!d)return;d.innerHTML=`<div class="nprev">${html}</div>`;d.scrollIntoView({behavior:'smooth'})}
const go=(p,s)=>{page=p;if(s)sub=s;editId=null;sel=null;render();scrollTo(0,0)};

function bind(){
 $$('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,'draft'));
 const lo=async()=>{await B.logout();me=null;S=null;unitData=null;render()};$('#logout').onclick=lo;if($('#logout2'))$('#logout2').onclick=lo;
 if(me.role!=='admin'){const N=unitData.card?.notices||[];
  $$('[data-upn]').forEach(b=>b.onclick=()=>doPrint(N[+b.dataset.upn].html));$$('[data-ushow]').forEach(b=>b.onclick=()=>showPrev(N[+b.dataset.ushow].html));
  const c=$('#copyref');if(c)c.onclick=()=>navigator.clipboard?.writeText(c.dataset.v).then(()=>toast('Αντιγράφηκε'),()=>toast(c.dataset.v));
  if($('#kf'))$('#kf').onsubmit=async e=>{e.preventDefault();if($('#k1').value!==$('#k2').value){toast('Οι κωδικοί δεν ταιριάζουν');return}try{await B.changePassword(me,$('#k1').value);toast('Ο κωδικός άλλαξε');e.target.reset()}catch(err){toast(err.message)}};return}
 /* γενικά */
 $$('[data-payu]').forEach(b=>b.onclick=()=>{page='tx';sel=b.dataset.payu;editId=+b.dataset.amt;render()});
 /* στοιχεία */
 if($('#sf')){const st=S.settings;$('#sf').onsubmit=e=>{e.preventDefault();['name','address','afm','manager','iban','bank','mailUrl','mailKey'].forEach(k=>st[k]=$('#s_'+k).value.trim());
   const pc=num($('#s_pagioPct').value);if(pc>=0&&pc<=100)st.pagioPct=pc;st.openingCash=toC($('#s_openingCash').value);save();toast('Αποθηκεύτηκε')};
  $('#rf').onsubmit=e=>{e.preventDefault();const c=$('#rc').value;st.recurring.push({cat:c,desc:$('#rd').value.trim()||CATS[c][0],amount:toC($('#ra').value),vendor:$('#rv').value});save()};
  $$('[data-delrec]').forEach(b=>b.onclick=()=>{st.recurring.splice(+b.dataset.delrec,1);save()});
  $('#copyas').onclick=()=>navigator.clipboard?.writeText(APPS_SCRIPT).then(()=>toast('Αντιγράφηκε'),()=>toast('Επίλεξε και αντίγραψε τον κώδικα'));
  $('#exp').onclick=()=>{const t=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download='koinoxrista-'+today()+'.json';a.click()}catch(e){}const o=$('#expout');o.style.display='block';o.value=t};
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.units||!d.periods)throw Error('μη έγκυρο αρχείο');if(!confirm('Αντικατάσταση όλων των δεδομένων;'))return;S=d;save();toast('Έγινε επαναφορά')}catch(err){toast('Σφάλμα: '+err.message)}};
  if($('#reset'))$('#reset').onclick=async()=>{if(!confirm('Σβήνονται όλα. Συνέχεια;'))return;await B.resetAll();await B.init();me=null;render()}}
 /* συνεργάτες */
 $$('[data-ev]').forEach(b=>b.onclick=()=>{editId=b.dataset.ev;render();scrollTo(0,0)});
 if($('#vf')){$('#vcancel').onclick=()=>{editId=null;render()};$('#vf').onsubmit=e=>{e.preventDefault();let v=S.vendors.find(x=>x.id===editId);if(!v){v={id:uid()};S.vendors.push(v)}
  $$('[data-vf]').forEach(i=>v[i.dataset.vf]=i.value.trim());if(!v.name){toast('Βάλε επωνυμία');return}editId=null;save()}}
 /* διαμερίσματα */
 $$('[data-eu]').forEach(b=>b.onclick=()=>{editId=b.dataset.eu;render();scrollTo(0,0)});
 if($('#uf')){const u=unitOf(editId);$('#ucancel').onclick=()=>{editId=null;render()};
  $('#uf').onsubmit=e=>{e.preventDefault();Object.assign(u,{owner:$('#uo').value.trim(),ownerEmail:$('#uoe').value.trim(),tenant:$('#ut').value.trim(),tenantEmail:$('#ute').value.trim(),floor:$('#ufl').value.trim(),xe:num($('#uxe').value),xa:num($('#uxa').value)});
   $$('[data-mxp]').forEach(i=>u.meters[+i.dataset.mxp].xp=num(i.value));$$('[data-mxt]').forEach(i=>u.meters[+i.dataset.mxt].xt=num(i.value));editId=null;save();toast('Αποθηκεύτηκε')}}
 const pwgen=()=>Math.random().toString(36).slice(2,6)+Math.floor(1000+Math.random()*9000);
 $$('[data-mk]').forEach(b=>b.onclick=async()=>{const u=unitOf(b.dataset.mk),name=u.id.toLowerCase(),pw=pwgen();b.disabled=true;
  try{await B.createUser(name,pw,'unit',u.id);unitData.users=await B.listUsers();render();$('#pwout').innerHTML=`Λογαριασμός <b>${esc(u.label)}</b>: όνομα χρήστη <b>${esc(name)}</b>, κωδικός <b style="font-size:18px">${esc(pw)}</b>. Σημείωσέ τον και δώσ' τον στον ένοικο.`}catch(err){b.disabled=false;toast(err.message)}});
 $$('[data-pw]').forEach(b=>b.onclick=async()=>{const pw=pwgen();try{await B.resetPassword(b.dataset.pw,pw);$('#pwout').innerHTML=`Νέος κωδικός για <b>${esc(b.dataset.pw)}</b>: <b style="font-size:18px">${esc(pw)}</b>`}catch(err){toast(err.message)}});
 /* κοινόχρηστα */
 $$('[data-sub]').forEach(b=>b.onclick=()=>{sub=b.dataset.sub;render()});
 if($('#newp'))$('#newp').onclick=()=>{const id=$('#nm').value;if(!id)return;if(per(id)){toast('Ο μήνας υπάρχει ήδη');return}
  const prev=S.periods.filter(p=>p.id<id).sort((a,b)=>b.id.localeCompare(a.id))[0],readings={};S.units.forEach(u=>u.meters.forEach(m=>readings[m.id]={s:prev?.readings?.[m.id]?.e??'',e:''}));
  S.periods.push({id,status:'draft',expenses:S.settings.recurring.map(r=>({id:uid(),cat:r.cat,desc:r.desc,amount:r.amount,key:CATS[r.cat][1],payer:CATS[r.cat][2],vendor:r.vendor})),gas:{amount:0,desc:'',vendor:''},readings});save()};
 const p=draft();
 if($('#xf')&&p){const hint=()=>{const[t,k,y]=CATS[$('#xc').value];$('#xhint').textContent=`«${t}»: κατανομή με ${KEYS[$('#xk').value||k]}, βαρύνει ${PAYER[$('#xp').value||y].toLowerCase()}.`};['#xc','#xk','#xp'].forEach(s=>$(s).onchange=hint);hint();
  $('#xf').onsubmit=e=>{e.preventDefault();const cat=$('#xc').value,a=toC($('#xa').value);if(a<=0){toast('Βάλε ποσό');return}p.expenses.push({id:uid(),cat,desc:$('#xd').value.trim()||CATS[cat][0],amount:a,key:$('#xk').value||CATS[cat][1],payer:$('#xp').value||CATS[cat][2],vendor:$('#xv').value});save()};
  $$('[data-delx]').forEach(b=>b.onclick=()=>{p.expenses=p.expenses.filter(e=>e.id!==b.dataset.delx);save()});
  ['#gd','#ga','#gv'].forEach(s=>$(s).onchange=()=>{p.gas={desc:$('#gd').value,amount:toC($('#ga').value),vendor:$('#gv').value};save()});
  $$('[data-rd]').forEach(i=>i.onchange=()=>{const[m,k]=i.dataset.rd.split('|');p.readings[m]=p.readings[m]||{s:'',e:''};p.readings[m][k]=i.value.replace(',','.');save()});
  $('#delp').onclick=()=>{if(confirm('Διαγραφή του μήνα;')){S.periods=S.periods.filter(x=>x!==p);save()}};
  $('#issue').onclick=()=>{if(!confirm('Έκδοση κοινοχρήστων '+plabel(p.id)+'; Ο μήνας θα κλειδώσει.'))return;const c=calc(p),prev={};S.units.forEach(u=>prev[u.id]=ledger(u.id).balance);
   p.result={res:c.res,exp:c.exp,all:c.all,byExp:c.byExp,prev,units:JSON.parse(JSON.stringify(S.units))};p.status='issued';p.issuedAt=today();p.emailed={};sel=p.id;sub='issued';save();toast('Εκδόθηκαν. Στείλε email ή εκτύπωσε.')}}
 if($('#psel')){const P=per(sel);$('#psel').onchange=e=>{sel=e.target.value;render()};$('#mailall').onclick=()=>sendEmails(P);
  $('#printall').onclick=()=>doPrint(S.units.map(u=>noticeHTML(P,u.id)).join(''));
  $('#printno').onclick=()=>{const L=S.units.filter(u=>!recips(u).length);if(!L.length){toast('Όλοι έχουν email');return}doPrint(L.map(u=>noticeHTML(P,u.id)).join(''))};
  $('#printsum').onclick=()=>doPrint(amountsTable(P));$$('[data-pn]').forEach(b=>b.onclick=()=>doPrint(noticeHTML(P,b.dataset.pn)));
  $$('[data-mail]').forEach(b=>b.onclick=()=>sendEmails(P,b.dataset.mail));$$('[data-show]').forEach(b=>b.onclick=()=>showPrev(noticeHTML(P,b.dataset.show)));
  if($('#unissue'))$('#unissue').onclick=()=>{if(!confirm('Ακύρωση έκδοσης; Ο μήνας γίνεται ξανά πρόχειρος.'))return;P.status='draft';delete P.result;delete P.issuedAt;sub='draft';save()}}
 /* συναλλαγές */
 if($('#pf')){const h=()=>{const b=ledger($('#pu').value).balance;$('#phint').textContent='Υπόλοιπο διαμερίσματος: '+eur(b)};$('#pu').onchange=h;h();
  $('#tf').onchange=e=>{sel=e.target.value||null;editId=null;render()};
  $('#pf').onsubmit=e=>{e.preventDefault();const a=toC($('#pa').value);if(!a){toast('Βάλε ποσό');return}S.payments.push({id:uid(),unit:$('#pu').value,date:$('#pd').value||today(),amount:a,method:$('#pm').value,note:$('#pn').value.trim()});editId=null;save();toast('Καταχωρίστηκε')};
  $$('[data-delpay]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή είσπραξης;')){S.payments=S.payments.filter(x=>x.id!==b.dataset.delpay);save()}})}
 /* πληρωμές κτιρίου */
 if($('#bf')){$('#be').onchange=e=>{const o=e.target.selectedOptions[0];if(o.dataset.v!==undefined){$('#bv').value=o.dataset.v||'';$('#ba').value=o.dataset.r?(o.dataset.r/100).toFixed(2):''}};
  $('#bf').onsubmit=e=>{e.preventDefault();const a=toC($('#ba').value);if(!a){toast('Βάλε ποσό');return}S.bpay.push({id:uid(),exp:$('#be').value,vendor:$('#bv').value,date:$('#bd').value||today(),amount:a,method:$('#bm').value,desc:$('#bn').value.trim()});save();toast('Καταχωρίστηκε')};
  $$('[data-delb]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή πληρωμής;')){S.bpay=S.bpay.filter(x=>x.id!==b.dataset.delb);save()}})}
 /* κοινότητα */
 if($('#af')){$('#af').onsubmit=e=>{e.preventDefault();S.ann.push({id:uid(),date:today(),title:$('#at').value.trim(),text:$('#ax').value.trim()});save();toast('Δημοσιεύτηκε')};
  $$('[data-dela]').forEach(b=>b.onclick=()=>{if(confirm('Διαγραφή ανακοίνωσης;')){S.ann=S.ann.filter(x=>x.id!==b.dataset.dela);save()}})}
 /* αναφορές */
 if($('#ry')){$('#ry').onchange=e=>{sel=e.target.value;render()};$('#rprint').onclick=()=>doPrint('<div class="notice">'+$('#rep').innerHTML+'</div>')}
}
(async()=>{try{me=await B.init();if(me)await afterLogin();else render()}catch(e){$('#app').innerHTML=`<div class="login"><div class="card"><h1>Σφάλμα</h1><p>${esc(e.message)}</p></div></div>`}})();
}
</script>
</body>
</html>
